[project]
name = "cfb-calibration"
version = "0.1.0"
description = "ESPN college football win-probability calibration study"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "tenacity>=8.2",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "polars>=0.20",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.13",
    "tqdm>=4.66",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "python-dotenv>=1.0",
    "anyio>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cfb_calibration"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.8",
]
